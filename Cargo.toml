[package]
name = "envrun-cli"
version = "0.1.0"
edition = "2024"
description = "Manage local .env files across Git worktrees and run commands with them"
license-file = "LICENSE"
repository = "https://github.com/hikionori/envrun-cli"

[lib]
name = "envrun"

[[bin]]
name = "envrun"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
dotenvy = "0.15.7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
